name: recur
description: "A Routinery-style checklist timer app for Windows and Android."
publish_to: 'none'
version: 1.2.2+5

environment:
  sdk: ^3.7.0

dependencies:
  audioplayers: ^6.1.0
  cupertino_icons: ^1.0.8
  file_picker: ^12.0.0
  flutter:
    sdk: flutter
  flutter_overlay_window: ^0.5.0
  flutter_riverpod: ^3.1.0
  flutter_tts: ^4.2.0
  freezed_annotation: ^3.1.0
  go_router: ^17.5.0
  json_annotation: ^4.9.0
  logger: ^2.7.0
  path_provider: ^2.1.5
  riverpod_annotation: ^4.0.0
  shared_preferences: ^2.3.5
  uuid: ^4.5.1
  wakelock_plus: ^1.2.8

dev_dependencies:
  build_runner: ^2.4.14
  custom_lint: ^0.8.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^3.2.3
  json_serializable: ^6.9.4
  riverpod_generator: ^4.0.0+1
  riverpod_lint: ^3.1.0
  very_good_analysis: ^10.2.0

flutter:
  uses-material-design: true

dependency_overrides:
  analyzer_plugin: ^0.13.10
